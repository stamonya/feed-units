# Положить в репозиторий как .github/workflows/update-feed.yml
name: update-feed
on:
  schedule:
    - cron: "*/30 * * * *"   # раз в 30 минут
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert feed
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: python convert.py
      - name: Commit JSON
        run: |
          git config user.name "feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/units.json
          git diff --cached --quiet || (git commit -m "update units" && git push)
